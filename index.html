<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DINO chat</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--blue:#0068ff;--rail:#0091ff;--blue-l:#e5efff;--line:#e4e8ee;--txt:#081c36;--sub:#7589a3;--bg:#eaedf0;--green:#2db84c;--hover:#f3f5f9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);background:#fff;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font:inherit;color:inherit;border:none;outline:none;background:none}
svg{display:block;flex-shrink:0}
.app{display:flex;height:100%;width:100%}
.rail{width:64px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:18px 0 12px;gap:4px;flex-shrink:0}
.rail .me{margin-bottom:18px;cursor:pointer}
.ri{width:48px;height:48px;border-radius:8px;display:grid;place-items:center;color:#d6ebff;position:relative}
.ri:hover{background:rgba(0,0,0,.12)}.ri.on{background:rgba(0,0,0,.2);color:#fff}
.ri .bd{position:absolute;top:5px;right:5px;background:#f33;color:#fff;font-size:10.5px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:1.5px solid var(--rail)}
.rail .sp{flex:1}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex-shrink:0;position:relative;user-select:none;background-size:cover;background-position:center}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:26%;height:26%;border-radius:50%;background:var(--green);border:2px solid #fff}
.list{width:344px;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;background:#fff;min-width:0}
.sbar{display:flex;gap:4px;align-items:center;padding:16px 14px 10px}
.search{flex:1;background:#eaedf0;border-radius:6px;display:flex;align-items:center;padding:0 10px;height:34px;gap:8px;color:var(--sub);margin-right:4px}
.search input{flex:1;font-size:14px;color:var(--txt);min-width:0}
.ib{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:#5a6b85;flex-shrink:0}.ib:hover{background:#eaedf0}
.net{font-size:12.5px;padding:6px 14px;background:#fff6e0;color:#8a5a00;display:none}.net.show{display:block}.net.err{background:#fdeaea;color:#c62828}
.tabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--sub)}
.tabs button{padding:8px 0 9px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.chats{flex:1;overflow-y:auto}
.ci{display:flex;gap:12px;padding:10px 14px;cursor:pointer;align-items:center}
.ci:hover{background:var(--hover)}.ci.on{background:var(--blue-l)}
.ci .m{flex:1;min-width:0}
.ci .r1{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.ci .nm{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .tm{font-size:12px;color:var(--sub);flex-shrink:0}
.ci .r2{display:flex;justify-content:space-between;align-items:center;margin-top:3px;gap:6px}
.ci .pv{font-size:13.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci.unread .pv,.ci.unread .nm{color:var(--txt);font-weight:600}
.badge{background:#f33;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.ty{color:var(--blue)}
.cl-h{padding:12px 16px 4px;font-size:12.5px;font-weight:700;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.cl-h button{color:var(--blue);font-size:12.5px;font-weight:600}
.noitem{padding:34px 24px;text-align:center;color:var(--sub);font-size:14px;line-height:1.5}
.noitem .btn{margin-top:14px}
.bnav{display:none}
.chat{flex:1;display:flex;min-width:0;background:var(--bg)}
.cmain{flex:1;display:flex;flex-direction:column;min-width:0}
.welcome{flex:1;display:grid;place-items:center;text-align:center;padding:24px;background:#fff}
.welcome .big{font-size:90px}.welcome h2{font-size:22px;font-weight:600;margin:6px 0 8px}
.welcome p{color:var(--sub);max-width:420px;line-height:1.5;font-size:14.5px;margin:0 auto}
.myid{display:inline-flex;gap:8px;align-items:center;background:var(--blue-l);color:var(--blue);font-weight:700;letter-spacing:1px;padding:8px 14px;border-radius:8px;margin:14px 0 4px;font-size:16px}
.hd{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px;flex-shrink:0}
.hd .back{display:none;color:var(--blue);padding:4px}
.hd .t{flex:1;min-width:0}.hd .n{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .s{font-size:12.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .s.ty{color:var(--blue)}
.chips{display:flex;gap:6px}
.chip{font-size:12px;padding:6px 10px;border-radius:14px;background:#eaedf0;color:var(--sub);display:flex;gap:5px;align-items:center;white-space:nowrap;font-weight:600}
.chip.on{background:var(--blue-l);color:var(--blue)}
.msgs{flex:1;overflow-y:auto;padding:12px 18px 8px;display:flex;flex-direction:column}
.day,.sysm{align-self:center;background:rgba(0,0,0,.28);color:#fff;font-size:12px;padding:3px 12px;border-radius:12px;margin:12px 0 8px;text-align:center;max-width:90%}
.sysm{background:rgba(255,255,255,.8);color:#5a6b85;margin:8px 0}
.row{display:flex;gap:8px;align-items:flex-end;margin-top:2px}
.row.gap{margin-top:12px}.row.me{justify-content:flex-end}
.row .sp30{width:32px;flex-shrink:0}
.bub{max-width:min(540px,72%);padding:9px 12px;border-radius:8px;background:#fff;border:1px solid #dde3ea;font-size:15px;line-height:1.4;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.row.me .bub{background:var(--blue-l);border-color:#c9dcfb}
.bub a{color:var(--blue)}
.bub .sn{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.bub .ts{display:block;font-size:11.5px;color:var(--sub);margin-top:4px;white-space:normal}
.bub.img{padding:3px}.bub.img img{max-width:100%;max-height:320px;border-radius:6px;display:block;cursor:zoom-in}
.bub.img .ts,.bub.img .sn{padding:0 6px 3px}
.bub.big{font-size:40px;background:none;border:none;padding:0 2px}
.st{align-self:flex-end;font-size:12px;color:#5a6b85;margin:4px 2px 4px;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.75);padding:2px 9px;border-radius:10px}
.st.seen{color:var(--blue)}
.st .av+.av{margin-left:-6px;border:1.5px solid #fff}
.tdots{display:inline-flex;gap:4px;padding:6px 2px}
.tdots i{width:7px;height:7px;border-radius:50%;background:#9aa9bd;animation:b 1.2s infinite}
.tdots i:nth-child(2){animation-delay:.2s}.tdots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.cmp{background:#fff;border-top:1px solid var(--line);flex-shrink:0;position:relative}
.tools{display:flex;gap:2px;padding:4px 10px;border-bottom:1px solid var(--line)}
.tools button{width:38px;height:34px;border-radius:6px;display:grid;place-items:center;color:#5a6b85}.tools button:hover{background:#eaedf0}
.inp{display:flex;align-items:flex-end;gap:6px;padding:6px 12px 10px}
.inp textarea{flex:1;resize:none;max-height:120px;min-height:38px;padding:9px 4px;font-size:15px;line-height:1.4}
.sendb{height:38px;min-width:38px;border-radius:8px;display:grid;place-items:center;color:var(--blue);font-weight:700;font-size:14px;padding:0 10px;letter-spacing:.3px}
.sendb:hover{background:var(--blue-l)}
.emo{position:absolute;bottom:100%;left:10px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:8px;display:none;grid-template-columns:repeat(8,1fr);gap:2px;width:330px;max-height:230px;overflow:auto;z-index:5}
.emo.show{display:grid}
.emo button{font-size:22px;padding:4px;border-radius:6px}.emo button:hover{background:#eaedf0}
.info{width:300px;background:#fff;border-left:1px solid var(--line);flex-shrink:0;overflow-y:auto;display:none}
.info.show{display:block}
.info .top{text-align:center;padding:22px 16px 16px;border-bottom:6px solid var(--bg)}
.info .top .av{margin:0 auto 10px}.info .top b{font-size:18px;display:block}.info .top span{font-size:13px;color:var(--sub)}
.info .it{display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:14.5px;cursor:pointer}.info .it:hover{background:var(--hover)}
.info .it.red{color:#d32f2f}
.info h4{padding:14px 16px 4px;font-size:14px}
.mem{display:flex;gap:10px;align-items:center;padding:7px 16px;font-size:14.5px}
.mem small{color:var(--sub);font-size:12px;margin-left:auto}
.avwrap{position:relative;display:inline-block;cursor:pointer}
.avwrap .cam{position:absolute;right:-2px;bottom:-2px;background:#fff;border:1px solid var(--line);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;color:#5a6b85}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:20;padding:14px}
.ov.show{display:grid}
.md{background:#fff;border-radius:10px;width:100%;max-width:420px;max-height:92vh;overflow:auto;padding:20px}
.md h3{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.set{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.set .tx{flex:1}.set b{font-size:15px;display:block;font-weight:600}.set span{font-size:12.5px;color:var(--sub);line-height:1.4;display:block;margin-top:2px}
.sw{width:44px;height:24px;border-radius:12px;background:#c5cedb;position:relative;transition:.2s;flex-shrink:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--blue)}.sw.on::after{left:22px}
.fld{margin:10px 0}.fld label{font-size:12.5px;color:var(--sub);display:block;margin-bottom:4px}
.fld input{width:100%;border:1px solid #ccd5e0;border-radius:6px;padding:10px 12px;font-size:15px}
.fld input:focus{border-color:var(--blue)}
.cols{display:flex;gap:8px;flex-wrap:wrap}.cols button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.cols button.on{box-shadow:0 0 0 2px var(--blue)}
.btn{background:var(--blue);color:#fff;padding:9px 18px;border-radius:6px;font-weight:600;font-size:14.5px}
.btn.g{background:#eaedf0;color:var(--txt)}.btn.r{background:#fdeaea;color:#d32f2f}
.btn:disabled{opacity:.6}
.acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:10px;background:#f5f7fa;padding:10px 12px;border-radius:8px}
.pick{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.pk{display:flex;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;font-size:14.5px}
.pk:hover{background:var(--hover)}.pk input{width:18px;height:18px;accent-color:var(--blue)}
.gtop{display:flex;gap:12px;align-items:center}.gtop input{flex:1;border-bottom:1px solid #ccd5e0;padding:8px 2px;font-size:15px}
.mb{width:26px;height:26px;border-radius:50%;color:#8a99ad;opacity:0;align-self:center;display:grid;place-items:center;flex-shrink:0}
.mb:hover{background:rgba(0,0,0,.08)}.row:hover .mb{opacity:1}
@media(hover:none){.mb{opacity:.55}}
.bub.rec{background:transparent!important;border:1px dashed #b9c4d3!important;color:#7589a3;font-style:italic;font-size:14px}
.menu{position:fixed;background:#fff;border-radius:8px;box-shadow:0 4px 22px rgba(0,0,0,.22);z-index:25;min-width:190px;padding:4px 0}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 14px;font-size:14.5px;text-align:left}
.menu button:hover{background:var(--hover)}.menu .red{color:#d32f2f}
.pasterow{display:flex;gap:8px}.pasterow input{flex:1}
.bub.att{padding:6px}
.bub.att img{display:block;border-radius:6px;max-width:100%;cursor:zoom-in;background:#dfe6ef;object-fit:contain}
.fcard{display:flex;gap:10px;align-items:center;min-width:220px;max-width:300px;color:inherit;text-decoration:none;padding:4px 6px}
.fcard .fi{width:42px;height:42px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;flex-shrink:0}
.fcard .fm{min-width:0;flex:1}.fcard .fn{font-size:14.5px;font-weight:600;word-break:break-all;line-height:1.3}
.fcard .fs{font-size:12px;color:var(--sub);margin-top:2px}
.fcard .fdl{color:var(--blue);flex-shrink:0}
.fprog{height:4px;background:#d5dde8;border-radius:2px;margin-top:5px;overflow:hidden}.fprog i{display:block;height:100%;background:var(--blue)}
.imgph{display:grid;place-items:center;background:#dfe6ef;border-radius:6px;color:var(--sub);font-size:12.5px;text-align:center;padding:8px}
.dropz{outline:3px dashed var(--blue);outline-offset:-8px}
#mlist,#mtyp{display:flex;flex-direction:column}
.vthumb{position:relative;border-radius:6px;overflow:hidden;cursor:pointer;background:#000;max-width:100%}
.vplay{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.15)}
.vplay svg{background:rgba(0,0,0,.55);border-radius:50%;padding:13px;width:54px;height:54px}
.vdur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;padding:1px 7px;border-radius:8px}
.bub.att img[data-view]{cursor:zoom-in;display:block;border-radius:6px;object-fit:cover}
.fcard.view{cursor:pointer}.fcard.view:hover{background:rgba(0,0,0,.04);border-radius:8px}
a.fdl{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--blue);flex-shrink:0}a.fdl:hover{background:rgba(0,104,255,.12)}
/* trình xem */
#viewer{position:fixed;inset:0;background:rgba(8,12,18,.95);z-index:45;display:flex;flex-direction:column;color:#fff}
.vtop{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(0,0,0,.4)}
.vinfo{flex:1;min-width:0;display:flex;flex-direction:column}.vinfo b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vinfo span{font-size:12px;opacity:.7}
.vcount{font-size:13px;opacity:.7}
.vbtn{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:#fff}.vbtn:hover{background:rgba(255,255,255,.15)}
.vbody{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;position:relative}
.vbody img{max-width:96%;max-height:100%;object-fit:contain;cursor:zoom-in}.vbody img.zoom{max-width:none;max-height:none;cursor:zoom-out}
.vbody video{max-width:100%;max-height:100%;background:#000}
.vbody iframe{width:min(980px,96%);height:100%;border:none;background:#fff}
.vbody pre{width:min(980px,96%);height:100%;overflow:auto;background:#fff;color:#111;padding:16px;font:13.5px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;border-radius:8px;text-align:left}
.vaud{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px;text-align:center}
.vaico{width:96px;height:96px;border-radius:50%;background:#8e24aa;display:grid;place-items:center}
.vload{opacity:.7}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;color:#fff;background:rgba(255,255,255,.12);border-radius:8px;display:grid;place-items:center;z-index:2}
.vnav:hover{background:rgba(255,255,255,.25)}.vnav.l{left:12px}.vnav.r{right:12px}
.vopen{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:7px 14px;border-radius:16px;font-size:13px;text-decoration:none}
/* cuộc gọi */
#callov{position:fixed;inset:0;background:#10151c;z-index:50;display:flex;flex-direction:column;color:#fff}
.ctop{padding:14px 18px 4px;display:flex;flex-direction:column;gap:2px;text-align:center}
.ctop b{font-size:18px}.ctop span{font-size:13px;opacity:.75}
.cgrid{flex:1;min-height:0;display:grid;gap:8px;padding:8px;position:relative;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));grid-auto-rows:1fr}
.cgrid.n1,.cgrid.duo{grid-template-columns:1fr}
.cgrid.n3,.cgrid.n4{grid-template-columns:1fr 1fr}
.cgrid.n5,.cgrid.n6{grid-template-columns:repeat(3,1fr)}
.cgrid.duo .tile.me{position:absolute;right:18px;bottom:18px;width:190px;height:134px;z-index:2;box-shadow:0 4px 18px rgba(0,0,0,.55)}
.tile{position:relative;background:#1e2733;border-radius:12px;overflow:hidden;display:grid;place-items:center;min-height:0}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.tile.mirror video{transform:scaleX(-1)}.tile.novid video{opacity:0}
.tile .tav{position:relative;z-index:1;display:none}.tile.novid .tav{display:block}
.tile .tnm{position:absolute;left:10px;bottom:8px;z-index:2;background:rgba(0,0,0,.55);padding:3px 9px;border-radius:12px;font-size:13px;display:flex;gap:5px;align-items:center}
.cbar{display:flex;gap:16px;justify-content:center;padding:14px 10px calc(18px + env(safe-area-inset-bottom))}
.cbtn{width:54px;height:54px;border-radius:50%;background:#2c3745;color:#fff;display:grid;place-items:center}
.cbtn:hover{background:#3a4758}.cbtn.off{background:#fff;color:#10151c}.cbtn.on{background:var(--blue)}
.cbtn.red{background:#e53935}.cbtn.red:hover{background:#c62828}.cbtn.grn{background:#2db84c}
#ringov{position:fixed;inset:0;background:rgba(10,15,22,.78);z-index:55;display:grid;place-items:center;padding:14px}
.rbox{background:#fff;border-radius:16px;padding:28px 34px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:280px;max-width:100%;text-align:center}
.rbox b{font-size:20px}.rbox span{color:var(--sub);font-size:14px}
.rbtns{display:flex;gap:40px;margin-top:16px}
@media(max-width:820px){.cgrid{grid-template-columns:1fr 1fr}.cgrid.n1,.cgrid.duo{grid-template-columns:1fr}.cgrid.duo .tile.me{width:105px;height:150px;right:12px;bottom:12px}.cbtn{width:50px;height:50px}.cbar{gap:12px}}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:30}.lb.show{display:grid}.lb img{max-width:94%;max-height:94%}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,30,45,.92);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:40;max-width:88%;text-align:center;display:none}
@media(max-width:1099px){.info{display:none!important}}
@media(max-width:820px){
 .rail{display:none}.list{width:100%;border:none}
 .chat{position:fixed;inset:0;z-index:10;display:none}
 .app.inchat .chat{display:flex}.hd .back{display:block}
 .bnav{display:flex;border-top:1px solid var(--line);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
 .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:11px;color:var(--sub);position:relative}
 .bnav button.on{color:var(--blue)}
 .chip .lbl{display:none}.chip{padding:7px 9px}
 .bub{max-width:80%}.emo{width:calc(100vw - 20px)}
 .toast{bottom:110px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="rail">
    <div class="me" id="railMe"></div>
    <button class="ri on" id="rTab1" title="Tin nhắn"></button>
    <button class="ri" id="rTab2" title="Danh bạ"></button>
    <div class="sp"></div>
    <button class="ri" id="railSet" title="Cài đặt"></button>
  </div>
  <div class="list">
    <div class="sbar">
      <div class="search"><span id="icS"></span><input id="q" placeholder="Tìm kiếm"></div>
      <button class="ib" id="btnAdd" title="Thêm bạn"></button>

<script>
/* ================= tiện ích ================= */
const $=s=>document.querySelector(s);
const KEY='dino_chat_v2'+(location.hash||'');
const COLORS=['#0068ff','#e91e63','#ff9800','#4caf50','#9c27b0','#00acc1','#f44336','#607d8b'];
const EMOJIS='😀 😁 😂 🤣 😊 😍 😘 😎 🤔 😅 😢 😭 😡 🥰 😴 🤗 🙄 😱 🤩 😇 👍 👎 👏 🙏 💪 🎉 ❤️ 💔 🔥 ✨ 🌹 🍀 🦖 🐱 🐶 🍕 🍜 ☕ 🎂 ⚽'.split(' ');
const IC={
 chat:'<path d="M21 11.5a8.4 8.4 0 0 1-12.2 7.5L3 20.5l1.6-5A8.4 8.4 0 1 1 21 11.5z"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2a5.5 5.5 0 0 1 4.5 5.8"/>',
 groupplus:'<circle cx="8.5" cy="10" r="3.2"/><path d="M2 21a6.5 6.5 0 0 1 13 0"/><circle cx="16" cy="11.5" r="2.4"/><path d="M15.5 16a5 5 0 0 1 6 5"/><path d="M19 2.5v5.5M16.2 5.2h5.6"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
 dots:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',

 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 video:'<rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5 21.5 7v10l-6-3.5"/>',
 videooff:'<path d="M3 3l18 18"/><path d="M15.5 10.5 21.5 7v10l-4-2.3M13 6H5a2.5 2.5 0 0 0-2.5 2.5v7A2.5 2.5 0 0 0 5 18h8.5"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 micoff:'<path d="M3 3l18 18"/><path d="M9 9v2a3 3 0 0 0 5 2.2M15 9V6a3 3 0 0 0-5.7-1.3M5 11a7 7 0 0 0 11 5.7M19 11a7 7 0 0 1-.6 2.8M12 18v3"/>',
 screen:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
 hangup:'<path d="M3 14c5-4.5 13-4.5 18 0l-1.5 3-4-1.5v-2.4a9 9 0 0 0-7 0v2.4l-4 1.5z"/>',

 download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
 userplus:'<circle cx="9" cy="8" r="3.8"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/>',
 panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
 smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14a4.5 4.5 0 0 0 8 0M9 9.5h.01M15 9.5h.01"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/>',
 cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 check2:'<path d="M2 12.5l4.5 4.5L15 8M10 15.5l1.5 1.5L21 7.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
 close:'<path d="M6 6l12 12M18 6L6 18"/>',
 settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 pen:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/>',
 eye:'<path d="M2 12s3.7-7 10-7 10 7 10 7-3.7 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 thumb:'<path d="M7 11v9H4v-9h3zM7 11l4-7c1.5 0 2.5 1 2.2 2.5L12.7 10H19a2 2 0 0 1 2 2.4l-1.3 6A2 2 0 0 1 17.7 20H7"/>',
 leave:'<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/>',
};
const ic=(n,s=22,sw=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const now=()=>Date.now();
const ini=n=>(String(n).trim().split(/\s+/).slice(-1)[0]||'?')[0].toUpperCase();
function av(name,color,size,online,avatar){
  const bg=avatar?`background-image:url('${avatar}');`:`background:${color};`;
  return `<div class="av" style="width:${size}px;height:${size}px;${bg}font-size:${size*.42}px">${avatar?'':esc(ini(name))}${online?'<span class="dot"></span>':''}</div>`}
function hm(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function dayLabel(t){const d=new Date(t),n=new Date();const diff=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);return diff===0?'Hôm nay':diff===1?'Hôm qua':d.toLocaleDateString('vi-VN')}
function short(t){const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return hm(t);const diff=Math.round((n-d)/864e5);return diff<7?(diff<=1?'Hôm qua':diff+' ngày'):d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'})}
function ago(t){if(!t)return'Ngoại tuyến';const m=Math.floor((now()-t)/6e4);if(m<1)return'Vừa truy cập';if(m<60)return'Truy cập '+m+' phút trước';const h=Math.floor(m/60);if(h<24)return'Truy cập '+h+' giờ trước';return'Truy cập '+Math.floor(h/24)+' ngày trước'}
const onlyEmoji=s=>!!s&&/^(\p{Extended_Pictographic}|‍|️|\s){1,6}$/u.test(s)&&s.trim().length>0;
const fmtId=id=>id.slice(0,4).toUpperCase()+'-'+id.slice(4).toUpperCase();
function genId(){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<8;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',3200)}
const okColor=c=>/^#[0-9a-f]{6}$/i.test(c)?c:COLORS[0];
const okImg=(s,max)=>(typeof s==='string'&&s.startsWith('data:image/')&&s.length<max)?s:null;
const okId=s=>typeof s==='string'&&/^[a-z0-9]{8}$/.test(s);
function pickImage(cb){ // chọn ảnh → cắt vuông 160px
  const f=document.createElement('input');f.type='file';f.accept='image/*';
  f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),cv=document.createElement('canvas');cv.width=cv.height=160;
      cv.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);cb(cv.toDataURL('image/jpeg',.8))};
      im.onerror=()=>toast('Không đọc được ảnh');im.src=r.result};r.readAsDataURL(file)};
  f.click();
}

/* ================= dữ liệu (lưu trên máy) ================= */
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.contacts){s.groups=s.groups||{};s.outbox=s.outbox||[];return s}}catch(e){}
  return{me:null,settings:{typing:true,seen:true},contacts:{},chats:{},groups:{},outbox:[]}}
let S=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Bộ nhớ trình duyệt đã đầy')}};
const chatOf=id=>S.chats[id]||(S.chats[id]={msgs:[],unread:0});
/* thực thể = bạn bè hoặc nhóm */
function ent(id){
  const g=S.groups[id];if(g)return{id,name:g.name,color:g.color,avatar:g.avatar,group:true,g};
  const c=S.contacts[id];return c?{id,name:c.name,color:c.color,avatar:c.avatar,group:false,c}:null}
function prof(uid,key){
  if(uid===S.me.id)return S.me;
  return S.contacts[uid]||(S.groups[key]&&S.groups[key].profiles[uid])||{name:'Thành viên',color:COLORS[0]}}
const recipients=key=>S.groups[key]?S.groups[key].members.filter(x=>x!==S.me.id):[key];
const pubG=g=>({id:g.id,name:g.name,color:g.color,avatar:g.avatar,owner:g.owner,members:g.members,profiles:g.profiles,v:g.v});

/* ================= trạng thái mạng ================= */
let peer=null,netState='connecting',idTries=0;
const conns={},last={},typingMap={},typTO={},pending={},tryAt={};
let cur=null,tab='chats',filter='all',infoOpen=true,myTypeTO=null,myTypeSent=0;
const isOnline=id=>!!conns[id]&&now()-(last[id]||0)<25000;
const entOnline=e=>e.group?e.g.members.some(u=>u!==S.me.id&&isOnline(u)):isOnline(e.id);
const visible=()=>document.visibilityState==='visible';
function typingNames(key){const m=typingMap[key]||{};return Object.keys(m).filter(u=>now()-m[u]<6000).map(u=>prof(u,key).name)}

function setNet(s){netState=s;const n=$('#net');
  const m={connecting:'Đang kết nối máy chủ…',dup:'ID này đang được mở ở tab/thiết bị khác. Hãy đóng bản kia rồi tải lại trang.',error:'Mất kết nối máy chủ. Đang thử lại…',online:''};
  n.textContent=m[s]||'';n.className='net'+(s!=='online'?' show':'')+(s==='dup'||s==='error'?' err':'')}
function startNet(){
  if(typeof Peer==='undefined'){setNet('error');$('#net').textContent='Không tải được thư viện kết nối (cần Internet).';return}
  setNet('connecting');
  peer=new Peer('dino-'+S.me.id,{config:{iceServers:ICE}});
  peer.on('open',()=>{idTries=0;setNet('online');connectAll()});
  peer.on('connection',c=>wire(c));
  peer.on('call',mc=>{try{onMediaCall(mc)}catch(e){console.error(e)}});
  peer.on('disconnected',()=>{setNet('connecting');setTimeout(()=>{try{peer.reconnect()}catch(e){}},2000)});
  peer.on('close',()=>setNet('error'));
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){try{peer.destroy()}catch(_){}
      if(++idTries<=6){setNet('connecting');setTimeout(startNet,4000)}else setNet('dup');return}
    if(e.type==='peer-unavailable'){const m=/dino-([a-z0-9]+)/.exec(e.message||'');if(m&&pending[m[1]]){clearTimeout(pending[m[1]]);delete pending[m[1]];toast('Không tìm thấy ID này hoặc người đó đang ngoại tuyến')}return}
    setNet('error');setTimeout(()=>{if(peer&&peer.disconnected){try{peer.reconnect()}catch(_){}}},3000);
  });
}
function connectTo(id){
  if(!peer||netState!=='online'||id===S.me.id)return;
  if(isOnline(id)||now()-(tryAt[id]||0)<7000)return;
  tryAt[id]=now();
  try{wire(peer.connect('dino-'+id,{serialization:'json',reliable:true}))}catch(e){}
}
function allPeers(){const s=new Set(Object.keys(S.contacts));Object.values(S.groups).forEach(g=>g.members.forEach(u=>s.add(u)));s.delete(S.me.id);return[...s]}
function connectAll(){allPeers().forEach(connectTo)}
setInterval(()=>{
  Object.keys(conns).forEach(id=>{
    if(now()-(last[id]||0)>25000){goOffline(id);return}
    try{conns[id].send({t:'ping'})}catch(e){}
  });
  connectAll();refreshAll();
},8000);

function helloObj(add){return{t:'hello',id:S.me.id,name:S.me.name,color:S.me.color,avatar:S.me.avatar||null,add:!!add}}
function wire(c){
  const id=String(c.peer).replace(/^dino-/,'');
  const onOpen=()=>{conns[id]=c;last[id]=now();c.send(helloObj(pending[id]));refreshAll()};
  if(c.open)onOpen();else c.on('open',onOpen);
  c.on('data',d=>{last[id]=now();try{onData(id,d)}catch(e){console.error(e)}});
  c.on('close',()=>{if(conns[id]===c)goOffline(id)});
  c.on('error',()=>{});
}
function goOffline(id){
  if(typeof ringing!=='undefined'&&ringing&&ringing.from===id)endRinging(true);
  if(S.contacts[id]){S.contacts[id].lastSeen=last[id]||now();save()}
  try{conns[id]&&conns[id].close()}catch(e){}
  delete conns[id];Object.values(typingMap).forEach(m=>delete m[id]);refreshAll();
}
function sendTo(id,obj){const c=conns[id];if(c&&c.open){try{c.send(obj);return true}catch(e){}}return false}
function sendCtl(id,obj){ // tin điều khiển (nhóm): nếu offline thì xếp hàng gửi sau
  if(sendTo(id,obj))return;
  if(obj.t==='ginfo')S.outbox=S.outbox.filter(o=>!(o.to===id&&o.obj.t==='ginfo'&&o.obj.g.id===obj.g.id));
  S.outbox.push({to:id,obj});save();connectTo(id);
}

/* ================= giao thức ================= */
function onData(id,d){
  if(!d||typeof d!=='object')return;
  switch(d.t){
   case 'hello':{
     const p={name:String(d.name||id).slice(0,30),color:okColor(d.color),avatar:okImg(d.avatar,60000)};
     const known=!!S.contacts[id],wasAdding=!!pending[id];
     Object.values(S.groups).forEach(g=>{if(g.members.includes(id))g.profiles[id]=p});
     if(known||wasAdding||d.add){
       S.contacts[id]={...(S.contacts[id]||{}),id,...p};chatOf(id);
       if(wasAdding){clearTimeout(pending[id]);delete pending[id]}
       else if(!known)toast(p.name+' vừa kết bạn với bạn');
     }
     flush(id);save();refreshAll();
     if(wasAdding){closeModal();openChat(id)}
     break}
   case 'msg':{
     if(typeof d.id!=='string')return;
     const g=d.gid?S.groups[d.gid]:null;
     if(d.gid){if(!g||!g.members.includes(id))return}else if(!S.contacts[id])return;
     const key=d.gid||id,ch=chatOf(key);
     sendTo(id,{t:'ack',id:d.id,gid:d.gid});
     const old=ch.msgs.find(m=>m.id===d.id);
     if(old){if(old.att&&!old.att.ready&&!old.recalled)needFile(id,old.att.id,d.gid);return}
     const text=typeof d.text==='string'?d.text.slice(0,5000):'';
     const img=okImg(d.img,2e6),att=cleanAtt(d.att);
     if(!text&&!img&&!att)return;
     ch.msgs.push({id:d.id,from:'them',sender:id,text,img,att,t:Number(d.t0)||now(),read:false,seenSent:false});
     if(att)needFile(id,att.id,d.gid);
     if(typingMap[key])delete typingMap[key][id];
     if(cur===key&&visible())markRead(key);else{ch.unread++;beep()}
     save();refreshAll();break}
   case 'ack':{
     const key=d.gid||id,m=chatOf(key).msgs.find(x=>x.id===d.id&&x.from==='me');if(!m)break;
     if(S.groups[key]){m.acks=m.acks||[];if(!m.acks.includes(id))m.acks.push(id)}
     else if(m.status==='sent')m.status='delivered';
     save();refreshAll();break}
   case 'seen':{
     if(!Array.isArray(d.ids))return;
     const key=d.gid||id,g=S.groups[key];
     chatOf(key).msgs.forEach(m=>{if(m.from==='me'&&d.ids.includes(m.id)){
       if(g){m.seenBy=m.seenBy||[];if(!m.seenBy.includes(id))m.seenBy.push(id);m.acks=m.acks||[];if(!m.acks.includes(id))m.acks.push(id)}
       else m.status='seen'}});
     save();refreshAll();break}
   case 'typing':{
     const key=d.gid||id;
     if(d.gid){const g=S.groups[d.gid];if(!g||!g.members.includes(id))return}else if(!S.contacts[id])return;
     typingMap[key]=typingMap[key]||{};
     if(d.on){typingMap[key][id]=now();clearTimeout(typTO[key+id]);typTO[key+id]=setTimeout(refreshAll,6200)}else delete typingMap[key][id];
     refreshAll();break}
   case 'ginfo':{
     const g=d.g;
     if(!g||typeof g.id!=='string'||g.id.length>40||!Array.isArray(g.members))return;
     const members=g.members.filter(okId).slice(0,200);
     if(!members.includes(S.me.id)||!members.includes(id))return;
     const ex=S.groups[g.id];
     if(ex){if(!ex.members.includes(id)||Number(g.v)<=ex.v)return}else if(!S.contacts[id])return;
     const profiles={};members.forEach(u=>{const p=(g.profiles||{})[u]||{};profiles[u]={name:String(p.name||'Thành viên').slice(0,30),color:okColor(p.color),avatar:okImg(p.avatar,60000)}});
     S.groups[g.id]={id:g.id,name:String(g.name||'Nhóm').slice(0,40),color:okColor(g.color),avatar:okImg(g.avatar,60000),owner:okId(g.owner)?g.owner:id,members,profiles,v:Number(g.v)||1};
     const ch=chatOf(g.id);
     if(typeof d.evt==='string'&&d.evt)ch.msgs.push({id:'s'+now()+Math.random().toString(36).slice(2,5),from:'sys',text:d.evt.slice(0,200),t:now()});
     if(!ex){toast('Bạn được thêm vào nhóm "'+S.groups[g.id].name+'"');if(cur!==g.id)ch.unread++}
     members.forEach(u=>connectTo(u));
     save();refreshAll();break}
   case 'cinv':case 'cjoin':case 'cparts':case 'crej':case 'cleave':case 'cend':case 'cmedia':{onCallMsg(id,d);break}
   case 'fneed':{if(typeof d.aid==='string')streamFile(id,d.aid);break}
   case 'fchunk':{onChunk(id,d);break}
   case 'recall':{ // người gửi thu hồi → sửa bản lưu trên máy mình
     if(typeof d.id!=='string')return;
     if(d.gid){const g=S.groups[d.gid];if(!g||!g.members.includes(id))return}else if(!S.contacts[id])return;
     const key=d.gid||id,m=chatOf(key).msgs.find(z=>z.id===d.id&&z.from==='them'&&(z.sender||key)===id);
     if(m){dropAtt(m);m.recalled=true;m.text='';m.img=null;m.att=null;save();refreshAll()}
     break}
   case 'gleave':{
     const g=S.groups[d.gid];if(!g||!g.members.includes(id))return;
     const nm=prof(id,g.id).name;
     g.members=g.members.filter(u=>u!==id);delete g.profiles[id];g.v++;if(g.owner===id)g.owner=g.members[0];
     chatOf(g.id).msgs.push({id:'s'+now(),from:'sys',text:nm+' đã rời nhóm',t:now()});
     save();refreshAll();break}
  }
}
function flush(id){
  // 1) tin điều khiển đang xếp hàng
  S.outbox=S.outbox.filter(o=>o.to!==id||!sendTo(id,o.obj));
  // 2) gửi lại tin chưa được nhận
  Object.keys(S.chats).forEach(key=>{
    const g=S.groups[key],ch=S.chats[key];
    ch.msgs.forEach(m=>{
      if(m.from!=='me'||m.recalled)return;
      if(g){if(g.members.includes(id)&&!(m.acks||[]).includes(id))sendTo(id,wireMsg(m,key))}
      else if(key===id&&m.status==='sent')sendTo(id,wireMsg(m))});
    // xin lại file còn dang dở từ người này

const MAXFILE=50*1024*1024,CHUNK=12288,PREV=['image','video','audio','pdf','text'];
const EXTM={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',bmp:'image/bmp',mp4:'video/mp4',m4v:'video/mp4',webm:'video/webm',mov:'video/quicktime',ogv:'video/ogg',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',oga:'audio/ogg',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac',opus:'audio/ogg',pdf:'application/pdf'};
const TEXTEXT=new Set('txt md csv tsv json xml log js ts jsx tsx css html htm py java c cpp h cs go rs php sql yml yaml ini sh bat vue rb kt swift'.split(' '));
function kindOf(mime,name){ // chỉ cho xem trực tiếp những loại an toàn
  const ext=(String(name||'').split('.').pop()||'').toLowerCase();
  let m=String(mime||'').toLowerCase().split(';')[0].trim();
  if(!m||m==='application/octet-stream')m=EXTM[ext]||m;
  if(/^image\/(png|jpe?g|gif|webp|bmp)$/.test(m))return{kind:'image',mime:m};
  if(/^video\/(mp4|webm|ogg|quicktime)$/.test(m))return{kind:'video',mime:m};
  if(/^audio\/(mpeg|mp3|ogg|wav|x-wav|webm|mp4|aac|flac|x-m4a)$/.test(m))return{kind:'audio',mime:m};
  if(m==='application/pdf')return{kind:'pdf',mime:m};
  if(TEXTEXT.has(ext)||m.startsWith('text/'))return{kind:'text',mime:'text/plain'};
  return{kind:'file',mime:'application/octet-stream'}}
const fmtDur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const PLAY=n=>`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
function updProg(a){document.querySelectorAll('[data-prog="'+a.id+'"]').forEach(el=>{const t=el.querySelector('.pt');if(t)t.textContent=a.prog+'%';const b=el.querySelector('.fprog i');if(b)b.style.width=a.prog+'%'})}
const memBlobs={},attUrl={},parts={},streaming={};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let dbp=null;
function idb(){return dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('dino_files'+KEY,1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
function idbPut(k,b){memBlobs[k]=b;return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(b,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})).catch(()=>{})}
function getBlob(k){if(memBlobs[k])return Promise.resolve(memBlobs[k]);
  return idb().then(db=>new Promise((res,rej)=>{const q=db.transaction('f').objectStore('f').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})).catch(()=>null)}
function idbDel(k){delete memBlobs[k];if(attUrl[k]){try{URL.revokeObjectURL(attUrl[k])}catch(e){}delete attUrl[k]}
  idb().then(db=>{db.transaction('f','readwrite').objectStore('f').delete(k)}).catch(()=>{})}
const dropAtt=m=>{if(m&&m.att){idbDel(m.att.id);Object.keys(parts).forEach(p=>{if(p.endsWith(m.att.id))delete parts[p]})}};
function urlOf(aid){if(attUrl[aid])return Promise.resolve(attUrl[aid]);
  return getBlob(aid).then(b=>{if(!b)return null;return attUrl[aid]=URL.createObjectURL(b)})}
const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const b64=u8=>btoa(String.fromCharCode.apply(null,u8));
const attMeta=a=>a?{id:a.id,name:a.name,size:a.size,mime:a.mime,kind:a.kind,w:a.w,h:a.h}:undefined;
const wireMsg=(m,gid)=>({t:'msg',id:m.id,text:m.text,img:m.img,att:attMeta(m.att),t0:m.t,gid});
function cleanAtt(a){
  if(!a||typeof a!=='object'||typeof a.id!=='string'||!/^[A-Za-z0-9]{1,40}$/.test(a.id))return null;
  const size=Number(a.size);if(!(size>0)||size>MAXFILE)return null;

function findAtt(sender,aid){
  for(const key of Object.keys(S.chats)){const m=S.chats[key].msgs.find(z=>z.from==='them'&&(z.sender||key)===sender&&z.att&&z.att.id===aid);if(m)return{m,key}}

async function streamFile(to,aid){
  const k=to+aid;if(streaming[k])return;
  // chỉ gửi file mà mình đã gửi cho người này
  const ok=Object.keys(S.chats).some(key=>{const g=S.groups[key];if(g?!g.members.includes(to):key!==to)return false;return S.chats[key].msgs.some(m=>m.from==='me'&&!m.recalled&&m.att&&m.att.id===aid)});
  if(!ok)return;
  streaming[k]=1;
  try{
    const blob=await getBlob(aid);if(!blob)return;
    const n=Math.max(1,Math.ceil(blob.size/CHUNK));
    for(let i=0;i<n;i++){
      let c=conns[to];if(!c||!c.open)break;
      while(c.dataChannel&&c.dataChannel.bufferedAmount>512*1024){await sleep(40);c=conns[to];if(!c||!c.open)return}
      const u8=new Uint8Array(await blob.slice(i*CHUNK,(i+1)*CHUNK).arrayBuffer());
      if(!sendTo(to,{t:'fchunk',aid,i,n,d:b64(u8)}))break;
    }
  }finally{delete streaming[k]}
}
function needFile(from,aid,gid){sendTo(from,{t:'fneed',aid,gid})}
function onChunk(id,d){
  const aid=String(d.aid||''),i=d.i|0,n=d.n|0,f=findAtt(id,aid);
  if(!f||f.m.att.ready)return;
  if(n<1||n>5000||i<0||i>=n||typeof d.d!=='string'||d.d.length>20000)return;
  const pk=id+aid;let p=parts[pk];if(!p||p.n!==n)p=parts[pk]={n,arr:new Array(n),got:0};
  if(p.arr[i]===undefined){p.arr[i]=d.d;p.got++}
  const att=f.m.att;att.prog=Math.round(p.got/p.n*100);
  if(p.got===p.n){
    delete parts[pk];
    try{
      const bytes=p.arr.map(s=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);return u});
      const blob=new Blob(bytes,{type:att.mime});
      idbPut(att.id,blob).then(()=>{att.ready=true;save();refreshAll()});
    }catch(e){delete parts[pk];needFile(id,aid,f.key in S.groups?f.key:undefined)}
  }else if(i%8===0)updProg(att);
}
function resizeImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      URL.revokeObjectURL(url);
      const w0=im.naturalWidth,h0=im.naturalHeight;
      if(file.type==='image/gif'&&file.size<5e6)return res({blob:file,w:w0,h:h0,mime:file.type});
      const k=Math.min(1,1600/Math.max(w0,h0)),w=Math.round(w0*k),h=Math.round(h0*k);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
      cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);
      cv.toBlob(b=>b?res({blob:b,w,h,mime:'image/jpeg'}):rej(new Error('toBlob')),'image/jpeg',.82);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url;
  });
}

function renderMsgs(){

function hydrate(ml,box,stick){
  ml.querySelectorAll('[data-att]').forEach(el=>{
    const isV=el.tagName==='VIDEO';
    const go=u=>{if(isV){el.onloadedmetadata=()=>{const d=el.parentNode.querySelector('.vdur');if(d&&isFinite(el.duration))d.textContent=fmtDur(el.duration)};el.src=u+'#t=0.1'}else el.src=u};
    el.onload=()=>{if(stick)box.scrollTop=box.scrollHeight};
    const miss=()=>{const d=document.createElement('div');d.className='imgph';d.style.cssText=(isV?el.parentNode:el).getAttribute('style')||'';d.textContent='Tệp không còn trên máy này';(isV?el.parentNode:el).replaceWith(d)};
    if(attUrl[el.dataset.att])go(attUrl[el.dataset.att]);else urlOf(el.dataset.att).then(u=>{if(u)go(u);else miss()});
  });
  ml.querySelectorAll('a[data-fatt]').forEach(el=>{
    if(el.getAttribute('href')==='#')urlOf(el.dataset.fatt).then(u=>{if(u)el.href=u;else{el.removeAttribute('download');const c=el.closest('.fcard'),s=c&&c.querySelector('.fs');if(s)s.textContent+=' · tệp không còn trên máy này'}});
  });

function attHtml(m){
  const a=m.att,ready=m.from==='me'||a.ready,pr=a.prog||0;
  const dims=mx=>{const w=Math.min(a.w||mx,mx);return a.w&&a.h?`width:${w}px;aspect-ratio:${a.w}/${a.h};max-width:100%`:`width:${Math.min(mx,240)}px;height:170px;max-width:100%`};
  if(a.kind==='image'||a.kind==='video'){
    const st=dims(a.kind==='video'?320:300);
    if(!ready)return `<div class="imgph" style="${st}" data-prog="${a.id}">Đang nhận ${a.kind==='video'?'video':'ảnh'}… <span class="pt">${pr}%</span></div>`;
    if(a.kind==='image')return `<img data-att="${a.id}" data-view="${m.id}" alt="ảnh" style="${st}">`;
    return `<div class="vthumb" data-view="${m.id}" style="${st}"><video data-att="${a.id}" preload="metadata" muted playsinline style="width:100%;height:100%;object-fit:cover"></video><span class="vplay">${PLAY(26)}</span><span class="vdur"></span></div>`;
  }
  const prev=PREV.includes(a.kind),bg=a.kind==='pdf'?'#e53935':a.kind==='audio'?'#8e24aa':a.kind==='text'?'#43a047':'var(--blue)';
  const inner=`<div class="fi" style="background:${bg}">${a.kind==='audio'?PLAY(22):ic('file',22)}</div><div class="fm"><div class="fn">${esc(a.name)}</div><div class="fs">${ready?fmtSize(a.size)+(prev?' · Bấm để xem':''):`Đang nhận… <span class="pt">${pr}%</span> · ${fmtSize(a.size)}`}</div>${ready?'':`<div class="fprog"><i style="width:${pr}%"></i></div>`}</div>`;
  if(!ready)return `<div class="fcard" data-prog="${a.id}">${inner}</div>`;
  if(prev)return `<div class="fcard view" data-view="${m.id}">${inner}<a class="fdl" data-fatt="${a.id}" download="${esc(a.name)}" href="#" title="Tải về">${ic('download',20)}</a></div>`;
  return `<a class="fcard" data-fatt="${a.id}" download="${esc(a.name)}" href="#">${inner}<span class="fdl">${ic('download',20)}</span></a>`;
}

let call=null,ringing=null,ringTone=null;

function mediaErr(err){
  const n=err&&err.name;
  toast(n==='NotAllowedError'||n==='SecurityError'?'Bạn chưa cho phép micro/camera. Hãy bấm biểu tượng ổ khoá trên thanh địa chỉ để cho phép':n==='NotFoundError'?'Không tìm thấy micro hoặc camera trên thiết bị này':(err&&err.message==='nomedia')?'Trình duyệt này không hỗ trợ gọi điện. Hãy mở bằng Chrome, Edge hoặc Safari':'Không mở được micro/camera');
}
async function getMedia(video){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nomedia');
  const audio={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
  try{return{stream:await navigator.mediaDevices.getUserMedia({audio,video:video?{width:{ideal:1280},height:{ideal:720},facingMode:'user'}:false}),video}}
  catch(e){
    if(video){const s=await navigator.mediaDevices.getUserMedia({audio});toast('Không mở được camera, chuyển sang gọi thoại');return{stream:s,video:false}}
    throw e}
}
function startRing(incoming){
  stopRing();
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const beep=()=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=incoming?(Math.floor(Date.now()/1200)%2?880:740):420;g.gain.value=.07;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.35)};
    beep();ringTone={ctx,t:setInterval(beep,incoming?1200:2200)}}catch(e){}
}
function stopRing(){if(ringTone){clearInterval(ringTone.t);try{ringTone.ctx.close()}catch(e){}ringTone=null}}
const sysMsg=(key,text)=>{if(!ent(key))return;chatOf(key).msgs.push({id:'s'+now()+Math.random().toString(36).slice(2,5),from:'sys',text,t:now()});save()};

async function startCall(video){
  if(call||ringing)return toast('Bạn đang trong một cuộc gọi khác');
  if(!cur)return;const e=ent(cur);if(!e)return;
  if(!peer||netState!=='online')return toast('Chưa kết nối máy chủ, vui lòng thử lại sau giây lát');
  const targets=recipients(cur).filter(isOnline);
  if(!targets.length)return toast(e.group?'Chưa có ai trong nhóm đang trực tuyến':e.name+' đang ngoại tuyến, chưa thể gọi');
  let m;try{m=await getMedia(video)}catch(err){return mediaErr(err)}
  if(call||ringing){m.stream.getTracks().forEach(t=>t.stop());return}
  const room='r'+now().toString(36)+Math.random().toString(36).slice(2,8);
  call={room,key:cur,gid:S.groups[cur]?cur:undefined,video:m.video,local:m.stream,parts:new Set(),invited:new Set(targets),calls:{},streams:{},media:{},started:0,state:'ringing',mic:true,cam:m.video,share:false,out:true,name:e.name};
  targets.forEach(u=>sendTo(u,{t:'cinv',room,gid:call.gid,video:m.video,parts:[S.me.id]}));
  call.ringT=setTimeout(()=>{if(call&&call.state==='ringing')endCall('noans')},45000);

function onCallMsg(id,d){
  if(!isKnown(id)||typeof d.room!=='string'||d.room.length>40)return;
  switch(d.t){
   case 'cinv':{
     if(call||ringing){sendTo(id,{t:'crej',room:d.room,busy:true});return}
     if(d.gid){const g=S.groups[d.gid];if(!g||!g.members.includes(id))return}else if(!S.contacts[id])return;
     const parts=new Set([id,...(Array.isArray(d.parts)?d.parts.filter(okId):[])]);parts.delete(S.me.id);
     ringing={from:id,room:d.room,gid:d.gid,video:!!d.video,parts:[...parts],key:d.gid||id};
     ringing.timer=setTimeout(()=>endRinging(true),45000);
     startRing(true);ringUI();break}
   case 'cend':{if(ringing&&ringing.room===d.room&&ringing.from===id)endRinging(true);break}
   case 'crej':{
     if(!call||call.room!==d.room)return;call.invited.delete(id);
     toast(prof(id,call.key).name+(d.busy?' đang bận':' đã từ chối cuộc gọi'));
     if(!call.parts.size&&!call.invited.size)endCall('rej');break}
   case 'cjoin':{
     if(!call||call.room!==d.room)return;
     joinPart(id);sendTo(id,{t:'cparts',room:call.room,parts:[S.me.id,...call.parts]});
     if(call.state==='ringing')activate();
     if(S.me.id>id)dial(id);callUI();break}
   case 'cparts':{
     if(!call||call.room!==d.room)return;
     (Array.isArray(d.parts)?d.parts.filter(okId):[]).forEach(p=>{
       if(p===S.me.id)return;
       if(!call.parts.has(p)){joinPart(p);sendTo(p,{t:'cjoin',room:call.room})}
       if(S.me.id>p)dial(p)});
     callUI();break}
   case 'cleave':{if(!call||call.room!==d.room)return;dropPart(id);break}
   case 'cmedia':{if(!call||call.room!==d.room)return;call.media[id]={mic:!!d.mic,cam:!!d.cam};callUI();break}
  }
}
function joinPart(id){call.parts.add(id);call.invited.delete(id)}
function dropPart(id){
  call.parts.delete(id);call.invited.delete(id);
  if(call.calls[id]){try{call.calls[id].close()}catch(e){}delete call.calls[id]}
  delete call.streams[id];delete call.media[id];
  if(call.state==='active'&&!call.parts.size&&!call.invited.size)endCall('end');else callUI();
}
function dial(p){ // bên có ID lớn hơn là bên gọi → không bao giờ gọi trùng
  if(!call||!peer||call.calls[p])return;
  try{attachCall(p,peer.call('dino-'+p,call.local,{metadata:{room:call.room}}))}catch(e){}
}
function onMediaCall(mc){
  const p=String(mc.peer).replace(/^dino-/,'');
  if(!call||!isKnown(p)||!mc.metadata||mc.metadata.room!==call.room){try{mc.close()}catch(e){}return}
  if(!call.parts.has(p))joinPart(p);
  if(call.calls[p]){try{call.calls[p].close()}catch(e){}}
  mc.answer(call.local);attachCall(p,mc);
  if(call.state==='ringing')activate();
}
function attachCall(p,mc){
  call.calls[p]=mc;
  mc.on('stream',st=>{if(call&&call.calls[p]===mc){call.streams[p]=st;callUI()}});
  mc.on('close',()=>{if(call&&call.calls[p]===mc){delete call.calls[p];delete call.streams[p];callUI()}});
  mc.on('error',()=>{});
  sendTo(p,{t:'cmedia',room:call.room,mic:call.mic,cam:call.cam||call.share});
}
function activate(){
  if(call.state==='active'&&call.started)return;
  call.state='active';call.started=now();clearTimeout(call.ringT);stopRing();
  clearInterval(call.tick);call.tick=setInterval(callStatus,1000);callUI();
}
async function acceptCall(){
  if(!ringing)return;const r=ringing;
  let m;try{m=await getMedia(r.video)}catch(err){mediaErr(err);declineCall();return}
  if(ringing!==r){m.stream.getTracks().forEach(t=>t.stop());return}
  clearTimeout(r.timer);ringing=null;stopRing();ringUI();
  call={room:r.room,key:r.key,gid:r.gid,video:m.video,local:m.stream,parts:new Set(r.parts),invited:new Set(),calls:{},streams:{},media:{},started:0,state:'active',mic:true,cam:m.video,share:false,out:false,name:ent(r.key).name};

function declineCall(){

function endRinging(missed){
  if(!ringing)return;const r=ringing;ringing=null;clearTimeout(r.timer);stopRing();ringUI();
  if(missed){sysMsg(r.key,'Cuộc gọi '+(r.video?'video':'thoại')+' nhỡ');if(cur!==r.key)chatOf(r.key).unread++;save();refreshAll()}
}
function endCall(reason){
  if(!call)return;const c=call;call=null;
  clearTimeout(c.ringT);clearInterval(c.tick);stopRing();
  [...c.parts].forEach(p=>sendTo(p,{t:'cleave',room:c.room}));
  [...c.invited].forEach(p=>sendTo(p,{t:'cend',room:c.room}));
  Object.values(c.calls).forEach(mc=>{try{mc.close()}catch(e){}});
  c.local.getTracks().forEach(t=>t.stop());if(c.screen)c.screen.getTracks().forEach(t=>t.stop());
  const k=c.video?'video':'thoại';
  let txt;
  if(c.started&&(c.parts.size||c.out===false||reason==='end'))txt=`Cuộc gọi ${k} · ${fmtDur((now()-c.started)/1000)}`;
  else if(reason==='rej')txt=`Cuộc gọi ${k} bị từ chối`;
  else if(reason==='noans')txt=`Cuộc gọi ${k} không có người trả lời`;
  else txt=`Cuộc gọi ${k} đã kết thúc`;
  sysMsg(c.key,txt);callUI();refreshAll();
}
const bcMedia=()=>{if(call)[...call.parts].forEach(p=>sendTo(p,{t:'cmedia',room:call.room,mic:call.mic,cam:call.cam||call.share}))};
function toggleMic(){call.mic=!call.mic;call.local.getAudioTracks().forEach(t=>t.enabled=call.mic);bcMedia();callUI()}
function toggleCam(){if(call.share||!call.video)return;call.cam=!call.cam;call.local.getVideoTracks().forEach(t=>t.enabled=call.cam);bcMedia();callUI()}
function swapVideo(track){Object.values(call.calls).forEach(mc=>{const pc=mc.peerConnection;if(!pc)return;const sd=pc.getSenders().find(x=>x.track&&x.track.kind==='video');if(sd)sd.replaceTrack(track).catch(()=>{})})}
async function toggleShare(){
  if(!call||!call.video)return;

    const ds=await navigator.mediaDevices.getDisplayMedia({video:true});
    if(!call){ds.getTracks().forEach(t=>t.stop());return}

  closeMenu();
  const da=t.closest('a[data-fatt]');
  if(da){if(da.getAttribute('href')==='#')e.preventDefault();return}
  const vv=t.closest('[data-view]');
  if(vv&&!t.closest('.mb')){openViewer(vv.dataset.view);return}
  if(t.dataset&&t.dataset.lb){$('#lbImg').src=t.src;$('#lb').classList.add('show')}
  if(!t.closest('.emo')&&!t.closest('#bEmo')){const em=$('#emo');if(em)em.classList.remove('show')}
  const a=t.closest('[data-act]');
  if(a){const k=a.dataset.act,g=S.groups[cur];
    if(k==='add')addModal();
    if(k==='newgroup')groupModal();
    if(k==='clear'&&cur&&confirm('Xoá toàn bộ lịch sử trò chuyện này trên máy của bạn?')){chatOf(cur).msgs.forEach(dropAtt);chatOf(cur).msgs=[];chatOf(cur).unread=0;save();refreshAll()}
    if(k==='unfriend'&&cur&&confirm('Xoá bạn này và toàn bộ tin nhắn?')){const id=cur;chatOf(id).msgs.forEach(dropAtt);delete S.contacts[id];delete S.chats[id];if(!allPeers().includes(id)){try{conns[id]&&conns[id].close()}catch(_){}delete conns[id]}save();closeChat()}
    if(k==='gavatar'&&g)pickImage(u=>{g.avatar=u;updateGroup(g,'Bạn đã đổi ảnh nhóm',S.me.name+' đã đổi ảnh nhóm')});
    if(k==='grename'&&g){const n=(prompt('Tên nhóm mới:',g.name)||'').trim().slice(0,40);if(n&&n!==g.name){g.name=n;updateGroup(g,'Bạn đã đổi tên nhóm thành "'+n+'"',S.me.name+' đã đổi tên nhóm thành "'+n+'"')}}
    if(k==='gadd')addMembersModal();
    if(k==='gleave'&&g&&confirm('Rời khỏi nhóm "'+g.name+'"? Bạn sẽ không nhận được tin nhắn của nhóm nữa.')){
      const id=cur;recipients(id).forEach(u=>sendCtl(u,{t:'gleave',gid:id}));chatOf(id).msgs.forEach(dropAtt);delete S.groups[id];delete S.chats[id];save();closeChat()}
  }
  const sw=t.closest('[data-sw]');if(sw)toggle(sw.dataset.sw);
  const nav=t.closest('[data-nav]');
  if(nav){const k=nav.dataset.nav;if(k==='me')settingsModal();else{tab=k;renderList()}}
});
$('#lb').onclick=()=>$('#lb').classList.remove('show');
const chatEl=$('#chat');
chatEl.addEventListener('dragover',e=>{if(cur&&e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();chatEl.classList.add('dropz')}});
chatEl.addEventListener('dragleave',e=>{if(e.target===chatEl||!chatEl.contains(e.relatedTarget))chatEl.classList.remove('dropz')});
chatEl.addEventListener('drop',e=>{chatEl.classList.remove('dropz');if(!cur||!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();const fs=[...e.dataTransfer.files];(async()=>{for(const f of fs)await sendAttachment(f)})()});
$('#chats').onclick=e=>{if(e.target.closest('[data-act]'))return;const it=e.target.closest('.ci');if(it)openChat(it.dataset.id)};
$('#q').oninput=renderList;
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;[...$('#tabs').children].forEach(x=>x.classList.toggle('on',x===b));renderList()};
$('#rTab1').onclick=()=>{tab='chats';renderList()};$('#rTab2').onclick=()=>{tab='contacts';renderList()};
$('#railSet').onclick=settingsModal;$('#railMe').onclick=settingsModal;$('#btnAdd').onclick=addModal;$('#btnGrp').onclick=groupModal;
$('#btnAdd').innerHTML=ic('userplus',22);$('#btnGrp').innerHTML=ic('groupplus',22);$('#icS').innerHTML=ic('search',17);
document.addEventListener('visibilitychange',()=>{if(visible()&&cur&&ent(cur)){markRead(cur);refreshAll()}});
window.addEventListener('focus',()=>{if(cur&&ent(cur)){markRead(cur);refreshAll()}});
window.addEventListener('beforeunload',()=>{try{if(call)endCall('end')}catch(e){}Object.keys(conns).forEach(id=>{try{conns[id].close()}catch(e){}});try{peer&&peer.destroy()}catch(e){}});

/* ================= khởi động ================= */
function begin(){drawMe();welcomeView();renderList();startNet()}
if(!S.me){
  let col=COLORS[0];
  openModal(`<h3>🦖 Chào mừng đến DINO chat</h3>
   <p style="color:var(--sub);font-size:14px;line-height:1.5">Tạo hồ sơ để bắt đầu. Bạn sẽ nhận một <b>ID DINO</b> riêng để bạn bè tìm và kết bạn với bạn. Dữ liệu được lưu ngay trên thiết bị này.</p>
   <div class="fld"><label>Tên của bạn</label><input id="wName" maxlength="24" placeholder="VD: Nguyễn Văn A"></div>
   <div class="fld"><label>Màu ảnh đại diện (đổi thành ảnh thật trong Cài đặt)</label><div class="cols" id="wCols">${COLORS.map(c=>`<button data-c="${c}" class="${c===col?'on':''}" style="background:${c}"></button>`).join('')}</div></div>
   <div class="acts"><button class="btn" id="wGo">Bắt đầu</button></div>`);
  $('#ov').onclick=null;
  $('#wCols').onclick=e=>{const c=e.target.dataset.c;if(!c)return;col=c;[...$('#wCols').children].forEach(b=>b.classList.toggle('on',b.dataset.c===c))};
  const go=()=>{const n=$('#wName').value.trim();if(!n){$('#wName').focus();return}
    S.me={id:genId(),name:n,color:col,avatar:null};save();closeModal();$('#ov').onclick=e=>{if(e.target.id==='ov')closeModal()};begin()};
  $('#wGo').onclick=go;$('#wName').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>$('#wName').focus(),100);
}else begin();
</script>
